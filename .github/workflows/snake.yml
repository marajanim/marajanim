name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#8B5CF6&color_dots=#EEEDE8,#E9D5FF,#C4B5FD,#A855F7,#7C3AED
            dist/snake-dark.svg?color_snake=#EC4899&color_dots=#1A1A22,#3B1F5C,#6D28D9,#A855F7,#EC4899

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
