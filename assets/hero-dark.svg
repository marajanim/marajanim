<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2F81F7"/><stop offset="0.6" stop-color="#26A641"/><stop offset="1" stop-color="#3FB950"/>
  </linearGradient>
  <clipPath id="c"><rect width="1200" height="440" rx="12"/></clipPath>
</defs>
<style>
  .t{font-family:Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;}
  .big{font-size:150px;font-weight:800;letter-spacing:-7px;}
  .rev{opacity:0;animation:up 1.1s cubic-bezier(.2,.8,.2,1) forwards;}
  .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.7s} .d4{animation-delay:.9s}
  @keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  .b1{animation:f1 14s ease-in-out infinite alternate}
  .b2{animation:f2 18s ease-in-out infinite alternate}
  .b3{animation:f3 16s ease-in-out infinite alternate}
  @keyframes f1{to{transform:translate(180px,60px)}}
  @keyframes f2{to{transform:translate(-220px,-40px)}}
  @keyframes f3{to{transform:translate(120px,-70px)}}
  .mq{animation:mq 32s linear infinite}
  @keyframes mq{to{transform:translateX(-2400px)}}
  .dot{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="440" fill="#0D1117"/>
  <g filter="url(#blur)" opacity="0.45">
    <circle class="b1" cx="820" cy="120" r="170" fill="#1F6FEB"/>
    <circle class="b2" cx="1060" cy="260" r="150" fill="#238636"/>
    <circle class="b3" cx="640" cy="300" r="120" fill="#2F81F7"/>
  </g>
  <rect width="1200" height="440" filter="url(#grain)" opacity="0.07"/>

  <g class="t rev" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8B949E">
    <text x="60" y="58">MARAJANIM — ©2026</text>
    <text x="1140" y="58" text-anchor="end">WEB DEVELOPER</text>
  </g>
  <line x1="60" y1="80" x2="1140" y2="80" stroke="#30363D"/>

  <text class="t big rev d1" x="52" y="215" fill="#E6EDF3">Maraj</text>
  <text class="t big rev d2" x="52" y="345" fill="url(#g)">Anim.</text>

  <g class="t rev d3" font-size="19" fill="#E6EDF3">
    <text x="760" y="268">I build websites and web apps</text>
    <text x="760" y="296">with React, Next.js and WordPress.</text>
  </g>
  <g class="t rev d4" font-size="13" font-weight="600" letter-spacing="2" fill="#8B949E">
    <text x="760" y="334">MARAJ.NET</text>
  </g>

  <rect y="380" width="1200" height="60" fill="#161B22"/>
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#30363D"/>
  <g class="mq">
    <text class="t" x="0" y="418" font-size="20" font-weight="600" fill="#E6EDF3" xml:space="preserve" textLength="2400" lengthAdjust="spacing">Next.js   /   React   /   Vite   /   TypeScript   /   JavaScript   /   WordPress   /   PHP   /   Node.js   /   HTML   /   CSS   /   Next.js   /   React   /   Vite   /   TypeScript   /   JavaScript   /   WordPress   /   PHP   /   Node.js   /   HTML   /   CSS   /   </text>
    <text class="t" x="2400" y="418" font-size="20" font-weight="600" fill="#E6EDF3" xml:space="preserve" textLength="2400" lengthAdjust="spacing">Next.js   /   React   /   Vite   /   TypeScript   /   JavaScript   /   WordPress   /   PHP   /   Node.js   /   HTML   /   CSS   /   Next.js   /   React   /   Vite   /   TypeScript   /   JavaScript   /   WordPress   /   PHP   /   Node.js   /   HTML   /   CSS   /   </text>
  </g>
</g>
</svg>